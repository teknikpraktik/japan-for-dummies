name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Lokal engångs-PostgreSQL för server- och e2e-tester. Aldrig Neon och aldrig produktionsdata.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: japan_app
          POSTGRES_PASSWORD: devonly_local_password
          POSTGRES_DB: japanresan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U japan_app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: devonly_local_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installera (låst beroendefil)
        run: npm ci
      - name: Innehållsvalidering
        run: npm run validate:content
      - name: Lint
        run: npm run lint
      - name: Typkontroll
        run: npm run typecheck
      - name: Skapa e2e-databas (lokal)
        run: psql -h localhost -U japan_app -d japanresan_test -c "CREATE DATABASE japanresan_e2e"
      - name: Enhets- och servertester (mot lokal PostgreSQL)
        run: npm test
      - name: Produktionsbygge, kontofritt (utan databas- och autentiseringsvariabler)
        run: npm run build
      - name: Installera Chromium för e2e
        run: npx playwright install --with-deps chromium
      - name: E2E-tester, kontofritt läge (standard)
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Bygge i kontoläge (NEXT_PUBLIC_ACCOUNTS_ENABLED=true) för återaktivering
        run: npm run build:konton
      - name: E2E-tester, kontoläge (lokal PostgreSQL)
        run: npm run test:e2e:konton
        env:
          CI: "true"
      - name: Spara rapport vid fel
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-spår
          path: test-results/
          retention-days: 7
